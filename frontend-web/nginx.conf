# Ingress LocalArchive: Basic Auth dla wszystkich ścieżek, statyczny React i reverse proxy do API.

# Prawdziwe IP klienta: Cloud Run dopisuje je jako OSTATNI element X-Forwarded-For
# (wcześniejsze elementy pochodzą od klienta i można je podrobić), a połączenia
# przychodzą z adresów 169.254.0.0/16. real_ip_recursive off => bierzemy ostatni adres.
set_real_ip_from  169.254.0.0/16;
set_real_ip_from  127.0.0.1;
real_ip_header    X-Forwarded-For;
real_ip_recursive off;

# Limity per IP (osobno w każdej instancji Cloud Run).
limit_req_zone $binary_remote_addr zone=per_ip:10m   rate=20r/s;   # cała strona: JS, API, zdjęcia
limit_req_zone $binary_remote_addr zone=auth:10m     rate=10r/m;   # logowanie, rejestracja, reset hasła
limit_req_status 429;

server {
    listen 8080;
    server_name _;
    server_tokens off;

    auth_basic           "LocalArchive";
    auth_basic_user_file /etc/nginx/auth/htpasswd;   # montowany z Secret Manager

    limit_req zone=per_ip burst=200 nodelay;         # galeria ładuje wiele zdjęć naraz

    client_max_body_size 2m;                         # Flask i tak odrzuca pliki > 1 MB

    # Nagłówki są powtórzone w location = /index.html, bo add_header na poziomie
    # location wyłącza dziedziczenie z server (tam też trzeba dopisać każdy nowy nagłówek).
    # CSP: wszystkie zasoby wyłącznie z tej samej domeny; React nie używa skryptów inline,
    # a style z komponentów ustawiane są przez CSSOM (nie podlegają style-src).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Authorization     "";       # hasło Basic Auth nie trafia do aplikacji
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    # Endpointy podatne na zgadywanie haseł i spam mailowy
    location ~ ^/api/v1/(login|register|forgot_password)(/|$) {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Authorization     "";
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;                  # routing po stronie Reacta
    }

    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
    }
}
